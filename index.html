  const F=L.final;s+=`<path d="M${X(F.t)} ${Y(F.v)-8}L${X(F.t)+8} ${Y(F.v)}L${X(F.t)} ${Y(F.v)+8}L${X(F.t)-8} ${Y(F.v)}Z" fill="var(--text-primary)" stroke="var(--surface-1)" stroke-width="2"/><text x="${X(F.t)-12}" y="${Y(F.v)-12}" text-anchor="end" style="fill:var(--text-primary)">Director 终验 ${F.v.toFixed(4)}×</text>`;
  const sy=H+6;L.segments.forEach(g=>{const x0=X(g.t0),w=X(g.t1)-x0;s+=`<rect x="${x0+1}" y="${sy}" width="${Math.max(w-2,1)}" height="${SH-8}" rx="3" fill="var(--c-${g.cat})"/>`;
   const lab={setup:'Setup',plan:'规划',eng:'工程师',verify:'验证',integ:'整合',final:'终验'}[g.cat]||'';if(lab&&w>lab.length*13+12)s+=`<text x="${x0+w/2}" y="${sy+18}" text-anchor="middle" style="fill:${ink(css('--c-'+g.cat))}">${lab}</text>`});
  for(let h=0;h<=xmax+1e-9;h+=xs)s+=`<text x="${Xh(h)}" y="${H+SH+18}" text-anchor="middle">${+h.toFixed(1)}</text>`;
  s+=`<text x="${(ml+W-mr)/2}" y="${H+SH+36}" text-anchor="middle">距该 lane 启动的墙钟时间（小时）</text>`;
  s+=`<line class="cross" x1="0" x2="0" y1="${mt}" y2="${H+SH}" stroke="var(--text-secondary)" stroke-width="1" visibility="hidden"/><rect class="hit" x="${ml}" y="${mt}" width="${W-ml-mr}" height="${H-mt+SH}" fill="transparent"/></svg>`;
  const div=document.createElement('div');div.className='panel';div.innerHTML=`<h2>${L.title} <span style="font-weight:400;color:var(--text-secondary)">· 启动 ${L.started_at.slice(5,16).replace('T',' ')} UTC · 总耗时 ${hrs.toFixed(2)} h</span></h2>`+s+'<div class="tip"></div>';P.appendChild(div);
  const svg=div.querySelector('svg'),tip=div.querySelector('.tip'),cr=div.querySelector('.cross');
  div.querySelector('.hit').addEventListener('mousemove',e=>{const b=svg.getBoundingClientRect(),px=e.clientX-b.left;const t=L.t0+(px-ml)/(W-ml-mr)*xmax*3600;
   if(t>L.t1){tip.style.display='none';cr.setAttribute('visibility','hidden');return}
   const g=L.segments.find(g=>g.t0<=t&&t<g.t1)||L.segments.at(-1);const near=L.points.concat([{...F,kind:'final'}]).filter(p=>p.kind!='integrate'||p.plotted).reduce((a,p)=>Math.abs(X(p.t)-px)<Math.abs(X(a.t)-px)?p:a);
   cr.setAttribute('x1',px);cr.setAttribute('x2',px);cr.setAttribute('visibility','visible');
   let near_txt='';if(Math.abs(X(near.t)-px)<10)near_txt=`<br>${near.kind=='final'?'Director 终验':near.kind=='integrate'?'整合 '+near.dir:'验证 '+near.dir}：${near.v?near.v.toFixed(4)+'×':'无有效值（'+(near.status||'')+'）'} @ ${fmtT(near.t)}`;
   const rr=g.rounds.filter(r=>r>0&&r<99);
   tip.innerHTML=`<b>${((t-L.t0)/3600).toFixed(2)} h</b>（${fmtT(t)} UTC）<br><i class="k" style="background:var(--c-${g.cat})"></i>${NAME[g.cat]}${rr.length?'（第 '+rr.join('/')+' 轮）':''}：${fmtT(g.t0)} → ${fmtT(g.t1)}，${Math.round((g.t1-g.t0)/60)} 分钟<br>当前采用的最佳：<b>${stepAt(L.incumbent,t).toFixed(4)}×</b>`+near_txt;
   tip.style.display='block';const tw=tip.offsetWidth;tip.style.left=Math.min(px+14,W-tw-4)+'px';tip.style.top=(e.clientY-div.getBoundingClientRect().top+14)+'px'});
  div.querySelector('.hit').addEventListener('mouseleave',()=>{tip.style.display='none';cr.setAttribute('visibility','hidden')});
 });}
function tables(){let h='';D.lanes.forEach(L=>{h+=`<h3>${L.title}</h3><table><tr><th>阶段</th><th>轮次</th><th>开始 (UTC)</th><th>结束</th><th>分钟</th></tr>`+L.segments.map(g=>`<tr><td>${NAME[g.cat]}</td><td>${g.rounds.filter(r=>r>0&&r<99).join('/')||'—'}</td><td>${fmtT(g.t0)}</td><td>${fmtT(g.t1)}</td><td class="n">${Math.round((g.t1-g.t0)/60)}</td></tr>`).join('')+'</table>';
 h+=`<table><tr><th>测量</th><th>时间 (UTC)</th><th>小时</th><th>speedup</th></tr>`+L.points.map(p=>`<tr><td>${p.kind=='verify'?'验证 ':'整合 '}${p.dir}${p.kind=='integrate'&&!p.plotted?'（未采用）':''}</td><td>${fmtT(p.t)}</td><td class="n">${((p.t-L.t0)/3600).toFixed(2)}</td><td class="n">${p.v?p.v.toFixed(4)+'×':'无有效值'}</td></tr>`).join('')+`<tr><td>Director 终验</td><td>${fmtT(L.final.t)}</td><td class="n">${((L.final.t-L.t0)/3600).toFixed(2)}</td><td class="n">${L.final.v.toFixed(4)}×</td></tr></table>`});document.getElementById('tables').innerHTML=h}
document.getElementById('theme').onclick=()=>{const r=document.documentElement,d=r.dataset.theme=='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);r.dataset.theme=d?'light':'dark';draw()};
addEventListener('resize',draw);draw();tables();
</script></body></html>
